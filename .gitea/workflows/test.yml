name: tests

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: npm ci
      - run: npm run coverage
      - run: npm run typecheck
      - run: npm run build
      - run: mkdir -p ../evidence
      - run: python3 -m venv ../evidence/coverage-venv
      - run: ../evidence/coverage-venv/bin/python -m pip install coverage==7.17.3
      - run: ../evidence/coverage-venv/bin/python -m coverage erase
      - run: ../evidence/coverage-venv/bin/python -m coverage run --branch --include='scripts/migrate.py,skills/id-ledger-query/scripts/query_ids.py' -m unittest scripts.test_migrate -v
      - run: ../evidence/coverage-venv/bin/python -m coverage run --append --branch --include='scripts/migrate.py,skills/id-ledger-query/scripts/query_ids.py' -m unittest discover -s skills/id-ledger-query/scripts -p 'test_*.py' -v
      - run: ../evidence/coverage-venv/bin/python -m coverage report --include='scripts/migrate.py,skills/id-ledger-query/scripts/query_ids.py' --fail-under=65
      - run: ../evidence/coverage-venv/bin/python -m coverage json --include='scripts/migrate.py,skills/id-ledger-query/scripts/query_ids.py' -o ../evidence/python-coverage.json
